<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>Tic-Tac-Toe</title>
    <style>
        .symbol {
            font-family: Calibri;
            font-size: 48px;
        }
        tr {
            height: 100px;
        }
        td {
            width: 100px;
            text-align: center;
            cursor: pointer;
        }
    </style>
    <script>
        let count = 0;
        let player = 1; // 1: X, 2: O

        function reloadGame() {
            setTimeout(() => { location.reload(); }, 300);
        }

        function determine(id) {
            const currentSelection = document.getElementById(id);

            if (currentSelection.innerHTML) {
                alert("此位置無法選取！");
                return;
            }

            currentSelection.innerHTML = (player === 1) ? 'X' : 'O';
            player = (player === 1) ? 2 : 1;
            count++;

            // 建立 3x3 棋盤陣列
            const grids = [];
            for (let i = 0; i < 3; i++) {
                grids[i] = [];
                for (let j = 0; j < 3; j++) {
                    grids[i][j] = document.getElementById(`grid${i+1}${j+1}`).innerHTML;
                }
            }

            // 判斷勝利
            let isLine = false;
            for (let i = 0; i < 3; i++) {
                if (grids[i][0] && grids[i][0] === grids[i][1] && grids[i][1] === grids[i][2]) isLine = true;
                if (grids[0][i] && grids[0][i] === grids[1][i] && grids[1][i] === grids[2][i]) isLine = true;
            }
            if ((grids[0][0] && grids[0][0] === grids[1][1] && grids[1][1] === grids[2][2]) ||
                (grids[2][0] && grids[2][0] === grids[1][1] && grids[1][1] === grids[0][2])) {
                isLine = true;
            }

            if (isLine) {
                alert(`${currentSelection.innerHTML} 贏了！`);
                reloadGame();
            } else if (count === 9) {
                alert("平手");
                reloadGame();
            }
        }
    </script>
</head>
<body>
    <table border="1" class="symbol">
        <tr>
            <td id="grid11" onclick="determine(this.id)"></td>
            <td id="grid12" onclick="determine(this.id)"></td>
            <td id="grid13" onclick="determine(this.id)"></td>
        </tr>
        <tr>
            <td id="grid21" onclick="determine(this.id)"></td>
            <td id="grid22" onclick="determine(this.id)"></td>
            <td id="grid23" onclick="determine(this.id)"></td>
        </tr>
        <tr>
            <td id="grid31" onclick="determine(this.id)"></td>
            <td id="grid32" onclick="determine(this.id)"></td>
            <td id="grid33" onclick="determine(this.id)"></td>
        </tr>
    </table>
</body>
</html>
